# FreePascal Configuration for Kayte - musl builds
# This file shows the compiler configuration options for musl cross-compilation
# Save as fpc.cfg in your project directory or use as reference

# ============================================================================
# ARM64 musl Configuration
# ============================================================================
# To build for ARM64 musl, use:
# fpc @fpc-arm64-musl.cfg kayte.lpr

#IFDEF CPUAARCH64
#IFDEF LINUX

# Target configuration
-Tlinux
-Paarch64

# musl toolchain
-XPaarch64-linux-musl-
-Xd

# Paths
-Fl/opt/aarch64-linux-musl-cross/aarch64-linux-musl/lib
-FU../build/units/kayte/aarch64-linux-musl
-FE../bin/aarch64-linux-musl

# Optimization
-O3
-CX
-XX
-Xs

# Linking
-k-static

# Output
-vh

#ENDIF
#ENDIF

# ============================================================================
# AMD64 musl Configuration
# ============================================================================
# To build for AMD64 musl, use:
# fpc @fpc-amd64-musl.cfg kayte.lpr

#IFDEF CPUX86_64
#IFDEF LINUX

# Target configuration
-Tlinux
-Px86_64

# musl toolchain
-XPx86_64-linux-musl-
-Xd

# Paths
-Fl/opt/x86_64-linux-musl-cross/x86_64-linux-musl/lib
-FU../build/units/kayte/x86_64-linux-musl
-FE../bin/x86_64-linux-musl

# Optimization
-O3
-CX
-XX
-Xs

# Linking
-k-static

# Output
-vh

#ENDIF
#ENDIF

# ============================================================================
# Common Options
# ============================================================================

# Syntax options
-Mobjfpc
-Scghi

# Code generation
-CX
-XX

# Verbosity
-vh

# ============================================================================
# Unit Search Paths (adjust based on your project structure)
# ============================================================================

# Core compiler units
-Fu../source

# Components

# Additional paths as needed
-Fi../source

# ============================================================================
# Include Search Paths
# ============================================================================
-Fi.
-Fi../source

# ============================================================================
# Library Search Paths
# ============================================================================
# These are added by architecture-specific sections above

# ============================================================================
# Debugging Options (uncomment for debug builds)
# ============================================================================
#-g         # Generate debug info
#-gl        # Use line info unit
#-gh        # Use heaptrace unit
#-Ci        # I/O checking
#-Co        # Overflow checking
#-Cr        # Range checking
#-Sa        # Include assertions
