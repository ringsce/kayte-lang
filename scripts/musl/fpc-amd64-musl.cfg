# FreePascal Configuration for AMD64 musl builds
# Usage: fpc @fpc-amd64-musl.cfg kayte.lpr

# Target
-Tlinux
-Px86_64

# musl toolchain
-XPx86_64-linux-musl-
-Xd

# Library paths
-Fl/opt/x86_64-linux-musl-cross/x86_64-linux-musl/lib

# Output directories
-FU../build/units/kayte/x86_64-linux-musl
-FE../bin/x86_64-linux-musl

# Unit search paths
-Fu../source

# Include paths
-Fi.
-Fi../source

# Optimization
-O3
-CX
-XX
-Xs

# Static linking
-k-static

# Syntax mode
-Mobjfpc
-Scghi

# Verbosity
-vh
-vw
