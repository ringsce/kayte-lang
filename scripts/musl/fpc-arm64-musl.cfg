# FreePascal Configuration for ARM64 musl builds
# Usage: fpc @fpc-arm64-musl.cfg kayte.lpr

# Target
-Tlinux
-Paarch64

# musl toolchain
-XPaarch64-linux-musl-
-Xd

# Library paths
-Fl/opt/aarch64-linux-musl-cross/aarch64-linux-musl/lib

# Output directories
-FU../build/units/kayte/aarch64-linux-musl
-FE../bin/aarch64-linux-musl

# Unit search paths
-Fu../source

# Include paths
-Fi.
-Fi../source

# Optimization
-O3
-CX
-XX
-Xs

# Static linking
-k-static

# Syntax mode
-Mobjfpc
-Scghi

# Verbosity
-vh
-vw
